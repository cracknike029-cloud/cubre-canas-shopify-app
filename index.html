<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cubre Canas — Pedido</title>

  <style>
    :root{
      font-family:Arial,Helvetica,sans-serif;
      color:#171717;
      background:#f6f6f6;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:24px;
    }

    .wrap{
      max-width:620px;
      margin:auto;
    }

    .card{
      background:#fff;
      border-radius:18px;
      padding:22px;
      box-shadow:0 6px 24px rgba(0,0,0,.08);
    }

    h1{
      margin:0 0 6px;
      font-size:27px;
    }

    .sub{
      margin:0 0 20px;
      color:#666;
    }

    label.field{
      display:block;
      font-weight:700;
      margin:15px 0 7px;
    }

    input,
    textarea{
      width:100%;
      padding:13px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
    }

    textarea{
      min-height:80px;
      resize:vertical;
    }

    .packs,
    .colors{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
    }

    .choice{
      border:1px solid #ccc;
      border-radius:12px;
      padding:12px;
      text-align:center;
      cursor:pointer;
      transition:.15s ease;
      user-select:none;
      margin:0;
    }

    .choice:hover{
      border-color:#777;
    }

    .choice input{
      display:none;
    }

    .choice.active{
      border:2px solid #111;
      background:#f3f3f3;
    }

    .choice strong{
      display:inline-block;
      font-size:16px;
    }

    .choice small{
      display:inline-block;
      margin-top:3px;
      font-size:14px;
    }

    .color-group{
      margin-top:14px;
    }

    .color-title{
      font-weight:700;
      margin-bottom:7px;
    }

    .summary{
      margin-top:18px;
      padding:14px;
      border-radius:12px;
      background:#f4f4f4;
    }

    .summary div{
      display:flex;
      justify-content:space-between;
      margin:5px 0;
    }

    button{
      width:100%;
      margin-top:18px;
      padding:15px;
      border:0;
      border-radius:12px;
      background:#111;
      color:#fff;
      font-weight:800;
      font-size:17px;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:wait;
    }

    .ok,
    .err{
      display:none;
      margin-top:14px;
      padding:13px;
      border-radius:10px;
      line-height:1.4;
    }

    .ok{
      background:#e7f7e8;
      color:#145c1a;
    }

    .err{
      background:#ffe9e9;
      color:#8b1111;
    }

    @media(max-width:460px){

      body{
        padding:12px;
      }

      .packs,
      .colors{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1 id="title">Cubre Canas</h1>

    <p class="sub">
      Completa tus datos para realizar tu pedido.
    </p>

    <form id="orderForm">

      <!-- NOMBRE -->

      <label class="field" for="firstName">
        Nombre
      </label>

      <input
        id="firstName"
        name="firstName"
        required
        autocomplete="given-name"
      >

      <!-- APELLIDO -->

      <label class="field" for="lastName">
        Apellido
      </label>

      <input
        id="lastName"
        name="lastName"
        required
        autocomplete="family-name"
      >

      <!-- TELÉFONO -->

      <label class="field" for="phone">
        Teléfono
      </label>

      <input
        id="phone"
        name="phone"
        required
        inputmode="tel"
        autocomplete="tel"
      >

      <!-- CORREO -->

      <label class="field" for="email">

        Correo electrónico

        <span style="font-weight:400">
          (opcional)
        </span>

      </label>

      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
      >

      <!-- DIRECCIÓN -->

      <label class="field" for="address">
        Dirección
      </label>

      <input
        id="address"
        name="address"
        required
        autocomplete="street-address"
      >

      <!-- CIUDAD -->

      <label class="field" for="city">
        Ciudad
      </label>

      <input
        id="city"
        name="city"
        required
        autocomplete="address-level2"
      >

      <!-- CANTIDAD -->

      <label class="field">
        Cantidad
      </label>

      <div
        id="packages"
        class="packs"
      ></div>

      <!-- COLORES -->

      <div id="colorGroups"></div>

      <!-- OBSERVACIONES -->

      <label
        class="field"
        for="notes"
      >

        Observaciones

        <span style="font-weight:400">
          (opcional)
        </span>

      </label>

      <textarea
        id="notes"
        name="notes"
      ></textarea>

      <!-- RESUMEN -->

      <div class="summary">

        <div>
          <span>
            Delivery
          </span>

          <strong>
            Gratis
          </strong>
        </div>

        <div>
          <span>
            Pago
          </span>

          <strong>
            Contra entrega
          </strong>
        </div>

        <div>
          <span>
            Total
          </span>

          <strong id="total">
            169.000 Gs
          </strong>
        </div>

      </div>

      <!-- BOTÓN -->

      <button
        id="submitBtn"
        type="submit"
      >
        COMPLETAR ORDEN
      </button>

      <!-- MENSAJES -->

      <div
        id="ok"
        class="ok"
        role="status"
      ></div>

      <div
        id="err"
        class="err"
        role="alert"
      ></div>

    </form>

  </div>

</div>


<script>

(async () => {

  /* =====================================================
     CONFIGURACIÓN DE RESPALDO
  ===================================================== */

  const FALLBACK_CONFIG = {

    productName:
      "Cubre Canas",

    currency:
      "PYG",

    delivery:
      "Delivery gratis",

    payment:
      "Pago contra entrega",

    colors: [
      "Negro",
      "Rojizo",
      "Café"
    ],

    packages: [

      {
        id:"1",
        label:"1 unidad",
        price:169000
      },

      {
        id:"2",
        label:"2 unidades",
        price:321100
      },

      {
        id:"3",
        label:"3 unidades",
        price:456300
      }

    ]

  };


  /* =====================================================
     ELEMENTOS
  ===================================================== */

  const titleEl =
    document.getElementById("title");

  const packagesEl =
    document.getElementById("packages");

  const colorGroupsEl =
    document.getElementById("colorGroups");

  const totalEl =
    document.getElementById("total");

  const form =
    document.getElementById("orderForm");

  const btn =
    document.getElementById("submitBtn");

  const ok =
    document.getElementById("ok");

  const err =
    document.getElementById("err");


  /* =====================================================
     FORMATO DE DINERO
  ===================================================== */

  const money = (value) => {

    const number =
      Number(value);

    if(!Number.isFinite(number)){
      return "0 Gs";
    }

    return (
      new Intl.NumberFormat("es-PY")
        .format(number)
      + " Gs"
    );

  };


  /* =====================================================
     OBTENER CONFIGURACIÓN
  ===================================================== */

  let config =
    FALLBACK_CONFIG;

  try{

    const response =
      await fetch(
        "/api/config",
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          },

          cache:"no-store"
        }
      );

    const text =
      await response.text();

    let parsed =
      null;

    try{

      parsed =
        JSON.parse(text);

    }catch(_){}

    if(
      response.ok &&
      parsed &&
      Array.isArray(parsed.packages) &&
      parsed.packages.length
    ){

      config =
        parsed;

    }

  }catch(error){

    console.warn(
      "Usando configuración de respaldo.",
      error
    );

  }


  /* =====================================================
     PRODUCTO
  ===================================================== */

  titleEl.textContent =
    config.productName ||
    "Cubre Canas";


  /* =====================================================
     OBTENER PAQUETE SELECCIONADO
  ===================================================== */

  function getSelectedPackage(){

    return form.querySelector(
      'input[name="packageId"]:checked'
    );

  }


  function getPackageData(){

    const id =
      getSelectedPackage()?.value;

    return config.packages.find(
      p =>
        String(p.id) ===
        String(id)
    ) || config.packages[0];

  }


  /* =====================================================
     CREAR COLORES SEGÚN CANTIDAD
  ===================================================== */

  function renderColors(quantity){

    colorGroupsEl.innerHTML = "";


    for(
      let i = 0;
      i < quantity;
      i++
    ){

      const group =
        document.createElement("div");

      group.className =
        "color-group";


      const title =
        document.createElement("div");

      title.className =
        "color-title";


      if(quantity === 1){

        title.textContent =
          "Color";

      }else{

        title.textContent =
          `Color de la unidad ${i + 1}`;

      }


      const colors =
        document.createElement("div");

      colors.className =
        "colors";


      (
        config.colors ||
        [
          "Negro",
          "Rojizo",
          "Café"
        ]
      ).forEach(
        (color,colorIndex) => {

          const label =
            document.createElement("label");

          label.className =
            "choice" +
            (
              colorIndex === 0
                ? " active"
                : ""
            );


          const input =
            document.createElement("input");

          input.type =
            "radio";

          input.name =
            `color${i + 1}`;

          input.value =
            color;

          input.required =
            true;

          if(colorIndex === 0){

            input.checked =
              true;

          }


          const text =
            document.createElement("strong");

          text.textContent =
            color;


          label.append(
            input,
            text
          );

          colors.appendChild(
            label
          );


          /* CLICK */

          label.addEventListener(
            "click",
            () => {

              input.checked =
                true;

              colors
                .querySelectorAll(
                  ".choice"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );

              label.classList.add(
                "active"
              );

            }
          );


          /* CHANGE */

          input.addEventListener(
            "change",
            () => {

              if(!input.checked){
                return;
              }

              colors
                .querySelectorAll(
                  ".choice"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );

              label.classList.add(
                "active"
              );

            }
          );

        }
      );


      group.append(
        title,
        colors
      );

      colorGroupsEl.appendChild(
        group
      );

    }

  }


  /* =====================================================
     CREAR CANTIDADES
  ===================================================== */

  packagesEl.innerHTML =
    "";


  config.packages
    .slice(0,3)
    .forEach(
      (p,index) => {

        const label =
          document.createElement(
            "label"
          );

        label.className =
          "choice" +
          (
            index === 0
              ? " active"
              : ""
          );


        const input =
          document.createElement(
            "input"
          );

        input.type =
          "radio";

        input.name =
          "packageId";

        input.value =
          String(p.id);

        input.required =
          true;

        input.checked =
          index === 0;


        const strong =
          document.createElement(
            "strong"
          );

        strong.textContent =
          p.label ||
          `${index + 1} unidad${
            index > 0
              ? "es"
              : ""
          }`;


        const br =
          document.createElement(
            "br"
          );


        const small =
          document.createElement(
            "small"
          );

        small.textContent =
          money(p.price);


        label.append(
          input,
          strong,
          br,
          small
        );


        packagesEl.appendChild(
          label
        );


        input.addEventListener(
          "change",
          () => {

            if(!input.checked){
              return;
            }


            packagesEl
              .querySelectorAll(
                ".choice"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            label.classList.add(
              "active"
            );


            totalEl.textContent =
              money(p.price);


            /*
              IMPORTANTE:

              Si seleccionamos:

              1 unidad → 1 color

              2 unidades → 2 colores

              3 unidades → 3 colores
            */

            renderColors(
              Number(p.id)
            );

          }
        );

      }
    );


  /* =====================================================
     ESTADO INICIAL
  ===================================================== */

  const firstPackage =
    config.packages[0];


  if(firstPackage){

    totalEl.textContent =
      money(firstPackage.price);

  }


  renderColors(
    Number(
      firstPackage?.id || 1
    )
  );


  /* =====================================================
     ERROR
  ===================================================== */

  function showError(message){

    ok.style.display =
      "none";

    err.textContent =
      message ||
      "No se pudo completar el pedido.";

    err.style.display =
      "block";

    err.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }


  /* =====================================================
     ÉXITO
  ===================================================== */

  function showSuccess(message){

    err.style.display =
      "none";

    ok.textContent =
      message;

    ok.style.display =
      "block";

    ok.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }


  /* =====================================================
     ENVIAR PEDIDO
  ===================================================== */

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      ok.style.display =
        "none";

      err.style.display =
        "none";


      /* VALIDACIÓN */

      if(!form.checkValidity()){

        form.reportValidity();

        return;

      }


      /* DATOS */

      const formData =
        new FormData(form);


      const data =
        Object.fromEntries(
          formData.entries()
        );


      const quantity =
        Number(
          data.packageId
        );


      /* =================================================
         OBTENER TODOS LOS COLORES
      ================================================= */

      const colors = [];


      for(
        let i = 1;
        i <= quantity;
        i++
      ){

        const color =
          data[`color${i}`];


        if(!color){

          showError(
            `Falta seleccionar el color de la unidad ${i}.`
          );

          return;

        }


        colors.push(
          color
        );

      }


      /*
        Eliminamos los campos individuales.

        Enviamos:

        colors: [
          "Negro",
          "Rojizo",
          "Café"
        ]
      */

      delete data.color1;
      delete data.color2;
      delete data.color3;


      data.colors =
        colors;


      const packageData =
        getPackageData();


      if(!packageData){

        showError(
          "Cantidad no válida."
        );

        return;

      }


      /* BOTÓN */

      btn.disabled =
        true;

      btn.textContent =
        "PROCESANDO...";


      try{

        const response =
          await fetch(
            "/api/orders",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json"
              },

              body:
                JSON.stringify(data)
            }
          );


        const text =
          await response.text();


        let result =
          null;


        try{

          result =
            JSON.parse(text);

        }catch(_){}


        if(!result){

          throw new Error(
            "El servidor no devolvió JSON. Revisa el despliegue de Render y los logs."
          );

        }


        if(
          !response.ok ||
          !result.ok
        ){

          throw new Error(
            result.message ||
            "No se pudo completar el pedido."
          );

        }


        /* ÉXITO */

        showSuccess(
          `¡Pedido recibido correctamente! Número de pedido: ${
            result.order?.name ||
            "confirmado"
          }.`
        );


        /* LIMPIAR */

        form.reset();


        /* CANTIDAD 1 */

        const firstChoice =
          packagesEl.querySelector(
            ".choice"
          );


        const firstInput =
          firstChoice?.querySelector(
            'input[name="packageId"]'
          );


        packagesEl
          .querySelectorAll(
            ".choice"
          )
          .forEach(
            item =>
              item.classList.remove(
                "active"
              )
          );


        if(
          firstInput
        ){

          firstInput.checked =
            true;

          firstChoice.classList.add(
            "active"
          );

        }


        /* COLOR */

        renderColors(1);


        /* TOTAL */

        totalEl.textContent =
          money(
            firstPackage?.price ||
            0
          );


      }catch(error){

        console.error(
          "Error al enviar pedido:",
          error
        );


        showError(
          error?.message ||
          "No se pudo completar el pedido. Intenta nuevamente."
        );


      }finally{

        btn.disabled =
          false;

        btn.textContent =
          "COMPLETAR ORDEN";

      }

    }
  );

})();

</script>

</body>
</html>
