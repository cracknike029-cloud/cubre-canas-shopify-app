<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cubre Canas — Pedido</title>

  <style>
    :root{
      font-family:Arial,Helvetica,sans-serif;
      color:#171717;
      background:#f6f6f6;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:24px;
    }

    .wrap{
      max-width:620px;
      margin:auto;
    }

    .card{
      background:#fff;
      border-radius:18px;
      padding:22px;
      box-shadow:0 6px 24px rgba(0,0,0,.08);
    }

    h1{
      margin:0 0 6px;
      font-size:27px;
    }

    .sub{
      margin:0 0 20px;
      color:#666;
    }

    label{
      display:block;
      font-weight:700;
      margin:15px 0 7px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:13px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
    }

    textarea{
      min-height:80px;
      resize:vertical;
    }

    .packs,
    .colors{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
    }

    .choice{
      border:1px solid #ccc;
      border-radius:12px;
      padding:12px;
      text-align:center;
      cursor:pointer;
      transition:.15s ease;
      user-select:none;
      margin:0;
    }

    .choice:hover{
      border-color:#777;
    }

    .choice input{
      display:none;
    }

    .choice.active{
      border:2px solid #111;
      background:#f3f3f3;
    }

    .choice strong{
      display:inline-block;
      font-size:16px;
    }

    .choice small{
      display:inline-block;
      margin-top:3px;
      font-size:14px;
    }

    .summary{
      margin-top:18px;
      padding:14px;
      border-radius:12px;
      background:#f4f4f4;
    }

    .summary div{
      display:flex;
      justify-content:space-between;
      margin:5px 0;
    }

    button{
      width:100%;
      margin-top:18px;
      padding:15px;
      border:0;
      border-radius:12px;
      background:#111;
      color:#fff;
      font-weight:800;
      font-size:17px;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:wait;
    }

    .ok,
    .err{
      display:none;
      margin-top:14px;
      padding:13px;
      border-radius:10px;
      line-height:1.4;
    }

    .ok{
      background:#e7f7e8;
      color:#145c1a;
    }

    .err{
      background:#ffe9e9;
      color:#8b1111;
    }

    @media(max-width:460px){
      body{
        padding:12px;
      }

      .packs,
      .colors{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1 id="title">Cubre Canas</h1>

    <p class="sub">
      Completa tus datos para realizar tu pedido.
    </p>

    <form id="orderForm">

      <!-- NOMBRE -->
      <label for="firstName">Nombre</label>

      <input
        id="firstName"
        name="firstName"
        required
        autocomplete="given-name"
      >

      <!-- APELLIDO -->
      <label for="lastName">Apellido</label>

      <input
        id="lastName"
        name="lastName"
        required
        autocomplete="family-name"
      >

      <!-- TELÉFONO -->
      <label for="phone">Teléfono</label>

      <input
        id="phone"
        name="phone"
        required
        inputmode="tel"
        autocomplete="tel"
      >

      <!-- CORREO -->
      <label for="email">
        Correo electrónico
        <span style="font-weight:400">
          (opcional)
        </span>
      </label>

      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
      >

      <!-- DIRECCIÓN -->
      <label for="address">Dirección</label>

      <input
        id="address"
        name="address"
        required
        autocomplete="street-address"
      >

      <!-- CIUDAD -->
      <label for="city">Ciudad</label>

      <input
        id="city"
        name="city"
        required
        autocomplete="address-level2"
      >

      <!-- CANTIDAD -->
      <label>Cantidad</label>

      <div id="packages" class="packs"></div>

      <!-- COLOR -->
      <label>Color</label>

      <div class="colors">

        <label class="choice active">
          <input
            type="radio"
            name="color"
            value="Negro"
            required
            checked
          >
          Negro
        </label>

        <label class="choice">
          <input
            type="radio"
            name="color"
            value="Rojizo"
          >
          Rojizo
        </label>

        <label class="choice">
          <input
            type="radio"
            name="color"
            value="Café"
          >
          Café
        </label>

      </div>

      <!-- OBSERVACIONES -->
      <label for="notes">
        Observaciones
        <span style="font-weight:400">
          (opcional)
        </span>
      </label>

      <textarea
        id="notes"
        name="notes"
      ></textarea>

      <!-- RESUMEN -->
      <div class="summary">

        <div>
          <span>Delivery</span>
          <strong>Gratis</strong>
        </div>

        <div>
          <span>Pago</span>
          <strong>Contra entrega</strong>
        </div>

        <div>
          <span>Total</span>
          <strong id="total">169.000 Gs</strong>
        </div>

      </div>

      <!-- BOTÓN -->
      <button
        id="submitBtn"
        type="submit"
      >
        COMPLETAR ORDEN
      </button>

      <!-- MENSAJES -->
      <div
        id="ok"
        class="ok"
        role="status"
      ></div>

      <div
        id="err"
        class="err"
        role="alert"
      ></div>

    </form>

  </div>

</div>


<script>
(async () => {

  /* =====================================================
     CONFIGURACIÓN DE RESPALDO
     Si /api/config falla, estos datos siguen funcionando.
  ===================================================== */

  const FALLBACK_CONFIG = {
    productName: "Cubre Canas",

    currency: "PYG",

    delivery: "Delivery gratis",

    payment: "Pago contra entrega",

    packages: [
      {
        id: "1",
        label: "1 unidad",
        price: 169000
      },
      {
        id: "2",
        label: "2 unidades",
        price: 321100
      },
      {
        id: "3",
        label: "3 unidades",
        price: 456300
      }
    ]
  };


  /* =====================================================
     ELEMENTOS
  ===================================================== */

  const titleEl =
    document.getElementById("title");

  const packagesEl =
    document.getElementById("packages");

  const totalEl =
    document.getElementById("total");

  const form =
    document.getElementById("orderForm");

  const btn =
    document.getElementById("submitBtn");

  const ok =
    document.getElementById("ok");

  const err =
    document.getElementById("err");


  /* =====================================================
     FORMATO DE DINERO
  ===================================================== */

  const money = (value) => {

    const number = Number(value);

    if (!Number.isFinite(number)) {
      return "0 Gs";
    }

    return (
      new Intl.NumberFormat("es-PY").format(number)
      + " Gs"
    );
  };


  /* =====================================================
     OBTENER CONFIGURACIÓN
  ===================================================== */

  let config = null;

  try {

    const response =
      await fetch(
        "/api/config",
        {
          method:"GET",
          headers:{
            "Accept":"application/json"
          },
          cache:"no-store"
        }
      );

    /*
      IMPORTANTE:

      Primero leemos como texto.
      Así evitamos el error:

      Unexpected token '<'

      cuando el servidor devuelve HTML
      en lugar de JSON.
    */

    const text =
      await response.text();

    let parsed = null;

    try {
      parsed = JSON.parse(text);
    } catch (_) {
      parsed = null;
    }

    if (
      !response.ok ||
      !parsed
    ) {

      console.warn(
        "No se pudo obtener /api/config. Usando configuración de respaldo."
      );

      config = FALLBACK_CONFIG;

    } else {

      config = parsed;

    }

  } catch (error) {

    console.warn(
      "Error conectando con /api/config:",
      error
    );

    config = FALLBACK_CONFIG;
  }


  /* =====================================================
     VALIDAR CONFIGURACIÓN
  ===================================================== */

  if (
    !config ||
    !Array.isArray(config.packages) ||
    config.packages.length === 0
  ) {

    config = FALLBACK_CONFIG;
  }


  /* =====================================================
     NOMBRE DEL PRODUCTO
  ===================================================== */

  titleEl.textContent =
    config.productName ||
    "Cubre Canas";


  /* =====================================================
     LIMPIAR PAQUETES
  ===================================================== */

  packagesEl.innerHTML = "";


  /* =====================================================
     CREAR OPCIONES DE CANTIDAD
  ===================================================== */

  config.packages
    .slice(0, 3)
    .forEach((p, index) => {

      const label =
        document.createElement("label");

      label.className =
        "choice" +
        (index === 0 ? " active" : "");

      const input =
        document.createElement("input");

      input.type = "radio";
      input.name = "packageId";
      input.value = String(p.id);
      input.required = true;

      if (index === 0) {
        input.checked = true;
      }


      const strong =
        document.createElement("strong");

      strong.textContent =
        p.label ||
        `${index + 1} unidad${index > 0 ? "es" : ""}`;


      const br =
        document.createElement("br");


      const small =
        document.createElement("small");

      small.textContent =
        money(p.price);


      label.appendChild(input);
      label.appendChild(strong);
      label.appendChild(br);
      label.appendChild(small);

      packagesEl.appendChild(label);


      /* ================================================
         CAMBIO DE CANTIDAD
      ================================================ */

      input.addEventListener(
        "change",
        () => {

          if (!input.checked) {
            return;
          }

          document
            .querySelectorAll(
              "#packages .choice"
            )
            .forEach(
              item =>
                item.classList.remove("active")
            );

          label.classList.add("active");

          totalEl.textContent =
            money(p.price);
        }
      );

    });


  /* =====================================================
     TOTAL INICIAL
  ===================================================== */

  const firstPackage =
    config.packages[0];

  if (firstPackage) {

    totalEl.textContent =
      money(firstPackage.price);

  }


  /* =====================================================
     SELECCIÓN DE COLOR
  ===================================================== */

  const colorChoices =
    document.querySelectorAll(
      ".colors .choice"
    );


  colorChoices.forEach(label => {

    const input =
      label.querySelector(
        'input[name="color"]'
      );

    label.addEventListener(
      "click",
      () => {

        /*
          Seleccionar explícitamente
          el radio.
        */

        input.checked = true;


        colorChoices.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


        label.classList.add("active");

      }
    );


    input.addEventListener(
      "change",
      () => {

        if (!input.checked) {
          return;
        }

        colorChoices.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );

        label.classList.add("active");

      }
    );

  });


  /* =====================================================
     FUNCIÓN PARA MOSTRAR ERROR
  ===================================================== */

  function showError(message) {

    ok.style.display = "none";

    err.textContent =
      message ||
      "No se pudo completar el pedido.";

    err.style.display = "block";

    err.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }


  /* =====================================================
     FUNCIÓN PARA MOSTRAR ÉXITO
  ===================================================== */

  function showSuccess(message) {

    err.style.display = "none";

    ok.textContent =
      message;

    ok.style.display = "block";

    ok.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }


  /* =====================================================
     ENVÍO DEL PEDIDO
  ===================================================== */

  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      ok.style.display = "none";
      err.style.display = "none";


      /* ================================================
         VALIDACIÓN NATIVA
      ================================================ */

      if (!form.checkValidity()) {

        form.reportValidity();

        return;
      }


      /* ================================================
         OBTENER DATOS
      ================================================ */

      const formData =
        new FormData(form);

      const data =
        Object.fromEntries(
          formData.entries()
        );


      /* ================================================
         VALIDACIÓN EXTRA
      ================================================ */

      if (!data.firstName?.trim()) {
        showError("Falta completar: Nombre.");
        return;
      }

      if (!data.lastName?.trim()) {
        showError("Falta completar: Apellido.");
        return;
      }

      if (!data.phone?.trim()) {
        showError("Falta completar: Teléfono.");
        return;
      }

      if (!data.address?.trim()) {
        showError("Falta completar: Dirección.");
        return;
      }

      if (!data.city?.trim()) {
        showError("Falta completar: Ciudad.");
        return;
      }

      if (!data.packageId) {
        showError("Selecciona una cantidad.");
        return;
      }

      if (!data.color) {
        showError("Selecciona un color.");
        return;
      }


      /* ================================================
         BOTÓN
      ================================================ */

      btn.disabled = true;

      btn.textContent =
        "PROCESANDO...";


      try {

        /* ==============================================
           ENVIAR AL SERVER
        ============================================== */

        const response =
          await fetch(
            "/api/orders",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json"
              },

              body:
                JSON.stringify(data)
            }
          );


        /*
          MUY IMPORTANTE:

          Leemos primero como texto para que
          NUNCA vuelva a aparecer:

          Unexpected token '<'
        */

        const responseText =
          await response.text();


        let result = null;


        try {

          result =
            JSON.parse(responseText);

        } catch (_) {

          /*
            El servidor devolvió HTML,
            no JSON.

            No intentamos hacer .json()
            nuevamente.
          */

          console.error(
            "Respuesta no JSON del servidor:",
            responseText
          );

          throw new Error(
            "El servidor no devolvió una respuesta válida. Verifica que la aplicación esté desplegada correctamente."
          );
        }


        /* ==============================================
           ERROR DEL SERVIDOR
        ============================================== */

        if (
          !response.ok ||
          !result ||
          !result.ok
        ) {

          throw new Error(
            result?.message ||
            "No se pudo completar el pedido."
          );
        }


        /* ==============================================
           PEDIDO CREADO
        ============================================== */

        const orderName =
          result?.order?.name ||
          "confirmado";


        showSuccess(
          `¡Pedido recibido correctamente! Número de pedido: ${orderName}.`
        );


        /* ==============================================
           LIMPIAR FORMULARIO
        ============================================== */

        form.reset();


        /* ==============================================
           RESTAURAR CANTIDAD 1
        ============================================== */

        const firstPackageChoice =
          document.querySelector(
            "#packages .choice"
          );

        const firstPackageInput =
          firstPackageChoice?.querySelector(
            'input[name="packageId"]'
          );


        document
          .querySelectorAll(
            "#packages .choice"
          )
          .forEach(
            item =>
              item.classList.remove(
                "active"
              )
          );


        if (
          firstPackageChoice &&
          firstPackageInput
        ) {

          firstPackageInput.checked = true;

          firstPackageChoice.classList.add(
            "active"
          );

        }


        /* ==============================================
           RESTAURAR COLOR NEGRO
        ============================================== */

        const blackInput =
          document.querySelector(
            '.colors input[value="Negro"]'
          );


        colorChoices.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


        if (blackInput) {

          blackInput.checked = true;

          blackInput
            .closest(".choice")
            ?.classList.add("active");

        }


        /* ==============================================
           RESTAURAR TOTAL
        ============================================== */

        if (firstPackage) {

          totalEl.textContent =
            money(firstPackage.price);

        }


      } catch (error) {

        console.error(
          "Error al enviar pedido:",
          error
        );


        showError(
          error?.message ||
          "No se pudo completar el pedido. Intenta nuevamente."
        );


      } finally {

        btn.disabled = false;

        btn.textContent =
          "COMPLETAR ORDEN";

      }

    }
  );

})();
</script>

</body>
</html>
